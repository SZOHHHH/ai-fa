name: deploy-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 260923 部署切换：Quartz → 自研 Astro 版（浅色出版风）
      # 链：site npm ci → prepare-content（吃 repo 根 md + 自产 contentIndex.json，Quartz 依赖已解除）
      #     → astro build（base=/ai-fa/）→ 部署 site/dist
      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
        working-directory: site

      - name: Prepare content + self-produced contentIndex
        run: node scripts/prepare-content.mjs
        working-directory: site

      - name: Build site
        run: npx astro build
        working-directory: site

      - name: Verify build output
        run: |
          test -f site/dist/index.html || (echo "::error::index.html missing" && exit 1)
          test -f site/dist/static/contentIndex.json || (echo "::error::contentIndex.json missing" && exit 1)
          echo "build ok: $(find site/dist -name '*.html' | wc -l) pages"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
