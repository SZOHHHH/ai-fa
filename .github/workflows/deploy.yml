name: deploy-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Quartz 4.5.2
        run: |
          curl -sL https://codeload.github.com/jackyzha0/quartz/tar.gz/refs/tags/v4.5.2 | tar xz --strip-components=1
          npm install --no-audit --no-fund

      - name: Prepare content
        run: |
          rm -rf content
          mkdir content
          cp -r 00-Meta 10-Papers 20-Algorithms 30-Formulas 40-Concepts 50-Canvas 60-Matrices index.md content/

      - name: Apply Quartz customization
        run: |
          cp quartz-patch/quartz.config.ts quartz-patch/quartz.layout.ts .
          cp -r quartz-patch/quartz/* quartz/
          rm -rf quartz-patch
          echo "quartz customization applied (config/layout/TopNav/custom.scss)"

      - name: Build site
        run: npx quartz build -o public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
